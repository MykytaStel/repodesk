name: Project Search Core Check

on:
  push:
    branches:
      - feat/code-project-search
    paths:
      - .github/workflows/project-search-core-check.yml

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/code-project-search
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy
      - name: Keep blocked metadata for honest skipped-file telemetry
        shell: python
        run: |
          from pathlib import Path

          path = Path("crates/repodesk-core/src/code_workspace_search.rs")
          text = path.read_text()
          old = '''    let files = Arc::new(\n        snapshot\n            .files\n            .into_iter()\n            .filter(|file| !file.blocked)\n            .collect::<Vec<_>>(),\n    );'''
          new = '''    let files = Arc::new(snapshot.files);'''
          if old not in text:
              raise SystemExit("Search index blocked-filter target not found")
          path.write_text(text.replace(old, new, 1))
          Path(".github/workflows/project-search-core-check.yml").unlink()
      - name: Format and focused core verification
        run: |
          cargo fmt --all
          cargo test -p repodesk-core code_workspace_search
          cargo clippy -p repodesk-core --all-targets -- -D warnings
      - name: Commit verified core cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(code): preserve project search skip telemetry"
          git push origin HEAD:feat/code-project-search
