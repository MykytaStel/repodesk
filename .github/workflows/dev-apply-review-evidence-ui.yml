name: Dev apply Review evidence UI

on:
  push:
    branches:
      - fix/execution-evidence-truth
    paths:
      - scripts/dev-apply-review-evidence-ui.py
      - .github/workflows/dev-apply-review-evidence-ui.yml

permissions:
  contents: write

jobs:
  green:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/execution-evidence-truth
          fetch-depth: 0
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          components: rustfmt
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.33.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml
      - name: Apply strict UI patch
        run: python3 scripts/dev-apply-review-evidence-ui.py
      - name: Format Rust
        run: cargo fmt --all
      - name: Install frontend deps
        run: pnpm --dir apps/desktop install --frozen-lockfile
      - name: Build frontend
        run: pnpm --dir apps/desktop run build
      - name: Verify Tauri command registration
        run: cargo check -p repodesk-desktop
      - name: Install Playwright Chromium
        run: pnpm --dir apps/desktop exec playwright install --with-deps chromium
      - name: Verify Review evidence UX GREEN
        run: pnpm --dir apps/desktop exec playwright test e2e/work-golden-path.spec.ts
      - name: Remove development helpers
        run: |
          rm scripts/dev-apply-review-evidence-ui.py
          rm .github/workflows/dev-apply-review-evidence-ui.yml
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: make Review execution evidence fail closed"
          git push origin HEAD:fix/execution-evidence-truth
