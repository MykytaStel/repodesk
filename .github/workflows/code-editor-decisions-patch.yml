name: Code editor decisions patch

on:
  push:
    branches:
      - ux/code-editor-decisions
    paths:
      - .github/workflows/code-editor-decisions-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ux/code-editor-decisions
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml
      - name: Patch CodeTab decision flows
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('apps/desktop/src/features/code/CodeTab.tsx')
          text = path.read_text()

          replacements = [
            (
              'import { IdeIcon } from "./IdeIcon";\n',
              'import { IdeIcon } from "./IdeIcon";\nimport { useIdeDecisionDialog } from "./IdeDecisionDialog";\n',
            ),
            (
              '  const idePreferences = useIdePreferences();\n',
              '  const idePreferences = useIdePreferences();\n  const { confirm: confirmEditorDecision, dialog: editorDecisionDialog } = useIdeDecisionDialog();\n',
            ),
            (
              '    if (existing?.dirty && forceReload) {\n      if (!window.confirm(`Discard unsaved changes in ${fileName(file.path)} and reload from disk?`)) return;\n      try {\n',
              '    if (existing?.dirty && forceReload) {\n      const discard = await confirmEditorDecision({\n        title: "Reload from disk?",\n        message: `Discard unsaved changes in ${fileName(file.path)} and reload the current disk version?`,\n        confirmLabel: "Discard and reload",\n        danger: true,\n      });\n      if (!discard) return;\n      try {\n',
            ),
            (
              '          const restore = recovery.state === "safe" || window.confirm(\n            `RepoDesk found an unsaved draft for ${fileName(document.path)}, but this file changed on disk after the draft was created.\\n\\nChoose OK to restore the draft into the editor without saving it. Choose Cancel to discard the draft and keep the current disk version.`,\n          );\n',
              '          const restore = recovery.state === "safe" || await confirmEditorDecision({\n            title: "Recovered draft conflicts with disk",\n            message: `RepoDesk found an unsaved draft for ${fileName(document.path)}, but the file changed on disk after that draft was created. Restore the draft into the editor without saving it, or keep the current disk version.`,\n            confirmLabel: "Restore draft",\n            cancelLabel: "Keep disk version",\n          });\n',
            ),
            (
              '  }, [discardPersistedDraft, tabs]);\n\n  const openLibrary',
              '  }, [confirmEditorDecision, discardPersistedDraft, tabs]);\n\n  const openLibrary',
            ),
            (
              '    if (target?.dirty) {\n      if (!window.confirm(`Discard unsaved changes in ${fileName(path)}?`)) return;\n      if (target.kind === "workspace") {\n',
              '    if (target?.dirty) {\n      const discard = await confirmEditorDecision({\n        title: "Close unsaved file?",\n        message: `Discard unsaved changes in ${fileName(path)} and close this editor tab?`,\n        confirmLabel: "Discard and close",\n        danger: true,\n      });\n      if (!discard) return;\n      if (target.kind === "workspace") {\n',
            ),
            (
              '      {workspaceActions.dialog}\n\n      <section className="code-editor-workbench">',
              '      {workspaceActions.dialog}\n      {editorDecisionDialog}\n\n      <section className="code-editor-workbench">',
            ),
          ]

          for old, new in replacements:
            count = text.count(old)
            assert count == 1, f'expected one match, found {count}: {old[:80]!r}'
            text = text.replace(old, new, 1)

          assert 'window.confirm' not in text, 'CodeTab still contains window.confirm'
          path.write_text(text)
          PY
      - name: Verify frontend build
        run: |
          pnpm --dir apps/desktop install --frozen-lockfile
          pnpm --dir apps/desktop build
      - name: Commit and remove patcher
        run: |
          rm .github/workflows/code-editor-decisions-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/desktop/src/features/code/CodeTab.tsx .github/workflows/code-editor-decisions-patch.yml
          git commit -m "ux(code): replace browser confirms with IDE decisions"
          git push origin HEAD:ux/code-editor-decisions
