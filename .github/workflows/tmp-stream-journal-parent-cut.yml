name: Temporary journal parent cut

on:
  push:
    branches:
      - perf/stream-verified-event-journal

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: perf/stream-verified-event-journal
          fetch-depth: 1
      - name: Cut parent implementation behind modules
        shell: python
        run: |
          from pathlib import Path
          parent = Path("crates/repodesk-core/src/persistence/event_journal.rs")
          text = parent.read_text()
          old = "use std::fs::{self, File, OpenOptions};\nuse std::io::{BufRead, BufReader, Write};"
          new = "use std::fs::{self, File};\nuse std::io::{BufRead, BufReader};"
          if text.count(old) != 1:
              raise SystemExit("unexpected fs/io imports")
          text = text.replace(old, new, 1)

          old = "mod revision;\npub use revision::{EngineeringEventRevision, engineering_event_revision};"
          new = "mod export;\nmod revision;\nmod scan;\n\npub use export::export_event_journal_jsonl;\npub use revision::{EngineeringEventRevision, engineering_event_revision};\npub use scan::{\n    journal_snapshot, read_engineering_events, read_events, read_task_events,\n    try_journal_snapshot,\n};\npub(crate) use scan::read_engineering_events_for_scope;"
          if text.count(old) != 1:
              raise SystemExit("unexpected module seam")
          text = text.replace(old, new, 1)

          start_marker = "// ── Read / integrity verification ────────────────────────────────────────────"
          end_marker = "// ── Formatting (CLI output) ───────────────────────────────────────────────────"
          if text.count(start_marker) != 1 or text.count(end_marker) != 1:
              raise SystemExit("unexpected section markers")
          start = text.index(start_marker)
          end = text.index(end_marker)
          text = text[:start] + text[end:]

          old = "mod tests {\n    use super::*;"
          new = "mod tests {\n    use super::*;\n    use std::fs::OpenOptions;\n    use std::io::Write;"
          if text.count(old) != 1:
              raise SystemExit("unexpected test module marker")
          parent.write_text(text.replace(old, new, 1))

          scan = Path("crates/repodesk-core/src/persistence/event_journal/scan.rs")
          scan_text = scan.read_text()
          pairs = [
              ("pub(super) fn read_engineering_events", "pub fn read_engineering_events"),
              ("pub(super) fn read_events", "pub fn read_events"),
              ("pub(super) fn read_task_events", "pub fn read_task_events"),
              ("pub(super) fn try_journal_snapshot", "pub fn try_journal_snapshot"),
              ("pub(super) fn journal_snapshot", "pub fn journal_snapshot"),
          ]
          for old, new in pairs:
              if scan_text.count(old) != 1:
                  raise SystemExit("unexpected scan visibility marker: " + old)
              scan_text = scan_text.replace(old, new, 1)
          scan.write_text(scan_text)

          export = Path("crates/repodesk-core/src/persistence/event_journal/export.rs")
          export_text = export.read_text()
          old = "pub(super) fn export_event_journal_jsonl"
          if export_text.count(old) != 1:
              raise SystemExit("unexpected export visibility marker")
          export.write_text(export_text.replace(old, "pub fn export_event_journal_jsonl", 1))

          Path(".github/workflows/tmp-stream-journal-parent-cut.yml").unlink()
      - name: Format and commit
        run: |
          cargo fmt --all
          git add -A
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "refactor: split verified journal scanning and export"
          git push origin HEAD:perf/stream-verified-event-journal
