name: Audit Closure Strategy Patch

on:
  push:
    branches: [fix/audit-closure-final]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply causal strategy telemetry patch
        shell: python
        run: |
          from pathlib import Path
          import re

          runner = Path('crates/repodesk-core/src/orchestrator/runner.rs')
          text = runner.read_text()
          old = '''/// Execute `plan` and return the aggregated run (also persisted to the run dir).\npub async fn run_plan(\n    plan: &OrchestrationPlan,\n    opts: &RunOptions,\n) -> RepoDeskResult<OrchestrationRun> {\n    let started_at = Utc::now().to_rfc3339();\n    let run_id = new_run_id();\n'''
          new = '''/// Reserve the execution identity before a strategy-aware launch.\n///\n/// This lets pre-execution evidence (for example `AiStrategySelected`) bind to\n/// the exact run without fabricating timestamps after the provider returns.\npub fn reserve_run_id() -> String {\n    new_run_id()\n}\n\n/// Execute `plan` with a fresh RepoDesk run identity.\npub async fn run_plan(\n    plan: &OrchestrationPlan,\n    opts: &RunOptions,\n) -> RepoDeskResult<OrchestrationRun> {\n    run_plan_with_id(plan, opts, reserve_run_id()).await\n}\n\n/// Execute `plan` using a previously reserved run identity.\n///\n/// The caller may use the identity only for best-effort intent telemetry before\n/// entering this execution boundary. All authoritative run/receipt evidence is\n/// still produced by the runner itself.\npub async fn run_plan_with_id(\n    plan: &OrchestrationPlan,\n    opts: &RunOptions,\n    run_id: String,\n) -> RepoDeskResult<OrchestrationRun> {\n    let started_at = Utc::now().to_rfc3339();\n'''
          assert old in text, 'runner entry boundary changed'
          runner.write_text(text.replace(old, new, 1))

          inst = Path('crates/repodesk-core/src/engineering/strategy_instrumentation.rs')
          text = inst.read_text()
          pattern = re.compile(r'''pub fn record_strategy_selection\(\n    run: &OrchestrationRun,\n    telemetry: StrategySelectionTelemetry<'_>,\n\) -> RepoDeskResult<\(\)> \{.*?\n    append_event\(&task\.run_dir, &event\)\.map\(\|_\| \(\)\)\n\}\n''', re.S)
          match = pattern.search(text)
          assert match, 'strategy instrumentation function changed'
          replacement = '''pub fn record_strategy_selection(\n    run: &OrchestrationRun,\n    telemetry: StrategySelectionTelemetry<'_>,\n) -> RepoDeskResult<()> {\n    record_strategy_selection_for_execution(\n        &run.project,\n        &run.task_id,\n        &run.run_id,\n        telemetry,\n    )\n}\n\n/// Record the strategy decision before provider/process execution begins.\n///\n/// `run_id` must come from `orchestrator::reserve_run_id`; the same id is then\n/// passed to `run_plan_with_id`. A launch that fails before producing execution\n/// evidence therefore leaves an explicit intent event, not a falsely completed\n/// run. Feedback projections treat such an execution as unsettled.\npub fn record_strategy_selection_for_execution(\n    project: &str,\n    task_id: &str,\n    run_id: &str,\n    telemetry: StrategySelectionTelemetry<'_>,\n) -> RepoDeskResult<()> {\n    let task = show_active_task()?.config;\n    if task.id != task_id || task.project_name != project {\n        return Err(RepoDeskError::Api(format!(\n            "strategy instrumentation active task mismatch: run {project}/{task_id} vs task {}/{}",\n            task.project_name, task.id\n        )));\n    }\n    let work_item_id = WorkItemId::try_new(task_id.to_string())\n        .map_err(|error| RepoDeskError::Api(format!("strategy instrumentation: {error}")))?;\n    let execution_id = ExecutionId::try_new(run_id.to_string())\n        .map_err(|error| RepoDeskError::Api(format!("strategy instrumentation: {error}")))?;\n\n    let mut event = EngineeringEvent::new(\n        project.to_string(),\n        work_item_id,\n        EngineeringEventKind::AiStrategySelected,\n    )\n    .with_execution(execution_id)\n    .with_attribute(\n        "requested_mode",\n        Value::String(telemetry.requested_mode.to_string()),\n    )\n    .with_attribute(\n        "resolved_profile",\n        Value::String(telemetry.resolved_profile.to_string()),\n    )\n    .with_attribute(\n        "plan_shape",\n        Value::String(telemetry.plan_shape.to_string()),\n    )\n    .with_attribute(\n        "plan_fingerprint",\n        Value::String(telemetry.plan_fingerprint.to_string()),\n    )\n    .with_attribute("baseline_steps", json!(telemetry.baseline_steps))\n    .with_attribute("planned_steps", json!(telemetry.planned_steps))\n    .with_attribute(\n        "baseline_estimated_tokens",\n        json!(telemetry.baseline_estimated_tokens),\n    )\n    .with_attribute(\n        "planned_estimated_tokens",\n        json!(telemetry.planned_estimated_tokens),\n    )\n    .with_attribute(\n        "estimated_saved_tokens",\n        json!(telemetry.estimated_saved_tokens),\n    )\n    .with_attribute(\n        "baseline_estimated_cost_units",\n        json!(telemetry.baseline_estimated_cost_units),\n    )\n    .with_attribute(\n        "planned_estimated_cost_units",\n        json!(telemetry.planned_estimated_cost_units),\n    );\n\n    if let Some(context_fingerprint) = telemetry.context_fingerprint {\n        event = event.with_attribute(\n            "context_fingerprint",\n            Value::String(context_fingerprint.to_string()),\n        );\n    }\n\n    append_event(&task.run_dir, &event).map(|_| ())\n}\n'''
          inst.write_text(text[:match.start()] + replacement + text[match.end():])

          cmd = Path('apps/desktop/src-tauri/src/commands/strategy.rs')
          text = cmd.read_text()
          old = '''    let opts = RunOptions {\n        dry_run,\n        max_cost,\n        settings,\n        authorization: ExecutionAuthorization {\n            allow_paid_providers: approve_paid,\n            allow_coding_agents: approve_coding_agents,\n            allow_workspace_writes: approve_coding_agents,\n        },\n        coding_agent_timeout_secs: 600,\n        agent_workspace_policy: AgentWorkspacePolicy::IsolatedRequired,\n    };\n    let run = orchestrator::run_plan(&prepared.plan, &opts).await?;\n\n    // Full prediction telemetry is best-effort: execution/receipt evidence has\n    // already completed and cannot be downgraded by an observability append.\n    let preview = &prepared.preview;\n    let _ = repodesk_core::engineering::record_strategy_selection(\n        &run,\n        StrategySelectionTelemetry {\n'''
          new = '''    let opts = RunOptions {\n        dry_run,\n        max_cost,\n        settings,\n        authorization: ExecutionAuthorization {\n            allow_paid_providers: approve_paid,\n            allow_coding_agents: approve_coding_agents,\n            allow_workspace_writes: approve_coding_agents,\n        },\n        coding_agent_timeout_secs: 600,\n        agent_workspace_policy: AgentWorkspacePolicy::IsolatedRequired,\n    };\n\n    // Bind intent evidence to the exact execution identity before any provider\n    // request or coding-agent process is launched. Telemetry is best-effort and\n    // never weakens the execution/receipt gates.\n    let run_id = orchestrator::reserve_run_id();\n    let preview = &prepared.preview;\n    let _ = repodesk_core::engineering::record_strategy_selection_for_execution(\n        &prepared.plan.project,\n        &prepared.plan.task_id,\n        &run_id,\n        StrategySelectionTelemetry {\n'''
          assert old in text, 'desktop strategy launch boundary changed'
          text = text.replace(old, new, 1)
          old_tail = '''        },\n    );\n\n    Ok(run)\n'''
          new_tail = '''        },\n    );\n\n    let run = orchestrator::run_plan_with_id(&prepared.plan, &opts, run_id).await?;\n    Ok(run)\n'''
          assert old_tail in text, 'desktop strategy telemetry tail changed'
          cmd.write_text(text.replace(old_tail, new_tail, 1))

      - name: Format Rust
        run: cargo fmt --all
      - name: Focused strategy instrumentation tests
        run: cargo test -p repodesk-core strategy_instrumentation
      - name: Focused runner tests
        run: cargo test -p repodesk-core orchestrator::runner
      - name: Commit product patch
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add crates/repodesk-core/src/orchestrator/runner.rs \
                  crates/repodesk-core/src/engineering/strategy_instrumentation.rs \
                  apps/desktop/src-tauri/src/commands/strategy.rs
          git diff --cached --check
          git commit -m "fix(strategy): record plan intent before execution"
          git push
