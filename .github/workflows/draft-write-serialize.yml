name: Draft Write Serialize

on:
  push:
    branches:
      - feat/code-draft-recovery
    paths:
      - .github/workflows/draft-write-serialize.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/code-draft-recovery
          fetch-depth: 0
      - name: Serialize autosaves per file
        shell: python
        run: |
          from pathlib import Path

          path = Path("apps/desktop/src/features/code/CodeTab.tsx")
          text = path.read_text()
          old = '''  const persistDraft = useCallback((tab: EditorTab): Promise<void> => {\n    if (tab.kind !== "workspace" || !tab.dirty) return Promise.resolve();\n\n    const write = saveCodeWorkspaceDraft({\n      path: tab.path,\n      content: tab.content,\n      base_fingerprint: tab.fingerprint,\n    }).then(() => {\n      setDraftError(null);\n    }).catch((error) => {\n      setDraftError(`Draft recovery backup failed for ${fileName(tab.path)}: ${errorToMessage(error)}`);\n    });\n\n    let tracked: Promise<void>;\n    tracked = write.finally(() => {\n      if (draftWritesRef.current.get(tab.path) === tracked) {\n        draftWritesRef.current.delete(tab.path);\n      }\n    });\n    draftWritesRef.current.set(tab.path, tracked);\n    return tracked;\n  }, []);'''
          new = '''  const persistDraft = useCallback((tab: EditorTab): Promise<void> => {\n    if (tab.kind !== "workspace" || !tab.dirty) return Promise.resolve();\n\n    const previous = draftWritesRef.current.get(tab.path) ?? Promise.resolve();\n    const write = previous.then(() => saveCodeWorkspaceDraft({\n      path: tab.path,\n      content: tab.content,\n      base_fingerprint: tab.fingerprint,\n    })).then(() => {\n      setDraftError(null);\n    }).catch((error) => {\n      setDraftError(`Draft recovery backup failed for ${fileName(tab.path)}: ${errorToMessage(error)}`);\n    });\n\n    let tracked: Promise<void>;\n    tracked = write.finally(() => {\n      if (draftWritesRef.current.get(tab.path) === tracked) {\n        draftWritesRef.current.delete(tab.path);\n      }\n    });\n    draftWritesRef.current.set(tab.path, tracked);\n    return tracked;\n  }, []);'''
          if old not in text:
              raise SystemExit("Draft persist block not found")
          path.write_text(text.replace(old, new, 1))
          Path(".github/workflows/draft-write-serialize.yml").unlink()
      - name: Verify frontend and commit
        run: |
          corepack enable
          corepack prepare pnpm@10.33.2 --activate
          pnpm --dir apps/desktop install --frozen-lockfile
          pnpm --dir apps/desktop build
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(code): serialize draft autosaves per file"
          git push origin HEAD:feat/code-draft-recovery
