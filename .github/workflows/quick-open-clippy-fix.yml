name: Quick Open Clippy Fix

on:
  push:
    branches:
      - feat/code-quick-open-index-v2
    paths:
      - .github/workflows/quick-open-clippy-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/code-quick-open-index-v2
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply Clippy suggestion exactly
        shell: python
        run: |
          from pathlib import Path

          path = Path("crates/repodesk-core/src/code_workspace_search.rs")
          text = path.read_text()
          old = '''    } else if let Some(gap) = subsequence_gap(&path, query) {\n        (7, gap)\n    } else {\n        return None;\n    };'''
          new = '''    } else {\n        let gap = subsequence_gap(&path, query)?;\n        (7, gap)\n    };'''
          if old not in text:
              raise SystemExit("Expected Clippy target not found")
          path.write_text(text.replace(old, new, 1))
          Path(".github/workflows/quick-open-clippy-fix.yml").unlink()
      - name: Format and commit
        run: |
          cargo fmt --all
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(code): satisfy quick open clippy gate"
          git push origin HEAD:feat/code-quick-open-index-v2
