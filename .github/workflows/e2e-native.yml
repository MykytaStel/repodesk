name: E2E (native)

# Real-backend Tauri E2E: drives the compiled binary via tauri-driver +
# WebdriverIO (Linux only — tauri-driver has no macOS support). The fast frontend
# Playwright suite still provides mock-IPC coverage; this workflow proves that the
# compiled WebView + Tauri IPC + repodesk-core stack boots and serves the current
# Work-first shell. Path filtering keeps the heavier release build off docs-only PRs.
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'apps/desktop/**'
      - 'crates/repodesk-core/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'scripts/e2e-native.sh'
      - '.github/workflows/e2e-native.yml'
  workflow_dispatch:

concurrency:
  group: e2e-native-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  native:
    name: tauri-driver + WebdriverIO smoke
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Tauri + WebDriver system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            webkit2gtk-driver \
            xvfb

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable @ 2026-08-14

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install tauri-driver
        run: cargo install tauri-driver --locked

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.33.2

      - name: Install Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml

      - name: Install frontend deps
        run: pnpm --dir apps/desktop install --frozen-lockfile

      - name: Build desktop app (release)
        run: pnpm --dir apps/desktop tauri build --no-bundle

      - name: Install native E2E harness deps
        run: pnpm --dir apps/desktop/e2e-native install

      # Throwaway REPODESK_HOME → first-run state (no project/task), so the smoke
      # asserts the Work → Scope onboarding funnel through real frontend + IPC + core.
      - name: Run native smoke
        run: |
          export REPODESK_HOME="$(mktemp -d)"
          echo "REPODESK_HOME=$REPODESK_HOME"
          xvfb-run -a pnpm --dir apps/desktop/e2e-native test

      - name: Upload native E2E failure artifacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-e2e-failure-${{ github.run_id }}
          path: apps/desktop/e2e-native/artifacts
          if-no-files-found: ignore
          retention-days: 7
