name: Dev stage evidence pipeline tests

on:
  push:
    branches:
      - fix/execution-evidence-truth
    paths:
      - scripts/dev-stage-evidence-pipeline-tests.py
      - .github/workflows/dev-stage-evidence-pipeline-tests.yml

permissions:
  contents: write

jobs:
  red:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/execution-evidence-truth
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          components: rustfmt
      - name: Stage test-only patch
        run: python3 scripts/dev-stage-evidence-pipeline-tests.py
      - name: Format Rust tests
        run: cargo fmt --all
      - name: Confirm Rust RED
        shell: bash
        run: |
          set +e
          cargo test -p repodesk-core --lib orchestrator:: 2>&1 | tee /tmp/rust-red.log
          code=${PIPESTATUS[0]}
          set -e
          if [ "$code" -eq 0 ]; then
            echo "Expected evidence-pipeline Rust tests to fail before implementation"
            exit 1
          fi
          grep -Eq "change_evidence_status|execution_issues|matching_receipt_status|ExecutionEvidenceStatus" /tmp/rust-red.log
      - name: Confirm architecture RED
        shell: bash
        run: |
          set +e
          node --test scripts/check-source-architecture.test.mjs 2>&1 | tee /tmp/arch-red.log
          code=${PIPESTATUS[0]}
          set -e
          if [ "$code" -eq 0 ]; then
            echo "Expected receipt-owner architecture test to fail before implementation"
            exit 1
          fi
          grep -Eq "canonical execution-receipt|no-write evidence|no writes detected" /tmp/arch-red.log
      - name: Remove development helpers
        run: |
          rm scripts/dev-stage-evidence-pipeline-tests.py
          rm .github/workflows/dev-stage-evidence-pipeline-tests.yml
      - name: Commit RED regressions
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "test: define execution evidence pipeline invariants"
          git push origin HEAD:fix/execution-evidence-truth
