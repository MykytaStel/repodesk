name: Dev apply evidence pipeline

on:
  push:
    branches:
      - fix/execution-evidence-truth
    paths:
      - scripts/dev-apply-evidence-pipeline.py
      - .github/workflows/dev-apply-evidence-pipeline.yml

permissions:
  contents: write

jobs:
  green:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/execution-evidence-truth
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          components: rustfmt
      - name: Apply strict production patch
        run: python3 scripts/dev-apply-evidence-pipeline.py
      - name: Format
        run: cargo fmt --all
      - name: Verify orchestrator GREEN
        run: |
          cargo test -p repodesk-core --lib orchestrator::
      - name: Verify evidence contract GREEN
        run: |
          cargo test -p repodesk-core --test execution_evidence_truth
      - name: Verify architecture ratchet GREEN
        run: node --test scripts/check-source-architecture.test.mjs
      - name: Remove development helpers
        run: |
          rm scripts/dev-apply-evidence-pipeline.py
          rm .github/workflows/dev-apply-evidence-pipeline.yml
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: make orchestration evidence truth-preserving"
          git push origin HEAD:fix/execution-evidence-truth
