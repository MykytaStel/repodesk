name: Dev stage Review evidence UI tests

on:
  push:
    branches:
      - fix/execution-evidence-truth
    paths:
      - scripts/dev-stage-review-evidence-ui-tests.py
      - .github/workflows/dev-stage-review-evidence-ui-tests.yml

permissions:
  contents: write

jobs:
  red:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/execution-evidence-truth
          fetch-depth: 0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.33.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml
      - name: Stage test-only UI patch
        run: python3 scripts/dev-stage-review-evidence-ui-tests.py
      - name: Install frontend deps
        run: pnpm --dir apps/desktop install --frozen-lockfile
      - name: Install Playwright Chromium
        run: pnpm --dir apps/desktop exec playwright install --with-deps chromium
      - name: Confirm Review evidence UX is RED
        shell: bash
        run: |
          set +e
          pnpm --dir apps/desktop exec playwright test e2e/work-golden-path.spec.ts 2>&1 | tee /tmp/red.log
          code=${PIPESTATUS[0]}
          set -e
          if [ "$code" -eq 0 ]; then
            echo "Expected Review evidence UX tests to fail before implementation"
            exit 1
          fi
          grep -Eq "orchestrate_evidence_state|cannot prove which tracked paths changed|persisted receipt needs repair|Changeset capture is complete" /tmp/red.log
      - name: Remove development helpers
        run: |
          rm scripts/dev-stage-review-evidence-ui-tests.py
          rm .github/workflows/dev-stage-review-evidence-ui-tests.yml
      - name: Commit RED UI tests
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "test: define truthful Review evidence states"
          git push origin HEAD:fix/execution-evidence-truth
