name: Dev fix evidence RED tests

on:
  push:
    branches:
      - fix/execution-evidence-truth
    paths:
      - scripts/dev-fix-evidence-red-tests.py
      - .github/workflows/dev-fix-evidence-red-tests.yml

permissions:
  contents: write

jobs:
  red:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/execution-evidence-truth
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          components: rustfmt
      - name: Correct test layout
        run: python3 scripts/dev-fix-evidence-red-tests.py
      - name: Format tests
        run: cargo fmt --all
      - name: Confirm corrected tests remain RED before production
        shell: bash
        run: |
          set +e
          cargo test -p repodesk-core --lib orchestrator:: 2>&1 | tee /tmp/red.log
          code=${PIPESTATUS[0]}
          set -e
          if [ "$code" -eq 0 ]; then
            echo "Expected corrected evidence tests to remain RED before production implementation"
            exit 1
          fi
          grep -Eq "matching_receipt_status|mismatched types|expected `bool`|change_evidence_status|execution_issues" /tmp/red.log
          if grep -q "cannot test inner items" /tmp/red.log; then
            echo "Evidence regression tests are still nested and therefore not registered"
            exit 1
          fi
      - name: Remove development helpers
        run: |
          rm scripts/dev-fix-evidence-red-tests.py
          rm .github/workflows/dev-fix-evidence-red-tests.yml
      - name: Commit corrected RED tests
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "test: register evidence provenance regressions"
          git push origin HEAD:fix/execution-evidence-truth
