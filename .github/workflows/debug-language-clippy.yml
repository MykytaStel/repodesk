name: Debug language clippy

on:
  push:
    branches:
      - fix/language-managed-tools-ci

jobs:
  clippy-log:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml
      - name: Install frontend deps
        run: pnpm --dir apps/desktop install --frozen-lockfile
      - name: Build frontend
        run: pnpm --dir apps/desktop run build
      - name: Capture clippy diagnostics
        shell: bash
        run: |
          set +e
          cargo clippy --all-targets --all-features -- -D warnings > clippy.log 2>&1
          status=$?
          cat clippy.log
          echo "clippy_exit=$status" >> clippy.log
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: language-clippy-log
          path: clippy.log
          if-no-files-found: error
