name: Fix language installer CI

on:
  push:
    branches:
      - fix/language-managed-tools-ci

permissions:
  contents: write

jobs:
  fix-and-verify:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/language-managed-tools-ci
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml
      - name: Install frontend deps
        run: pnpm --dir apps/desktop install --frozen-lockfile
      - name: Build frontend
        run: pnpm --dir apps/desktop run build
      - name: Bind confirmation token to typed project context
        shell: python
        run: |
          from pathlib import Path

          path = Path("crates/repodesk-core/src/language_tools.rs")
          text = path.read_text()

          call_old = "            project,\n            project_root,\n"
          call_new = (
              "            ProjectConfirmationBinding {\n"
              "                name: project,\n"
              "                root: project_root,\n"
              "            },\n"
          )
          signature_old = "fn confirmation_token(\n    project: &str,\n    project_root: &Path,\n"
          signature_new = (
              "struct ProjectConfirmationBinding<'a> {\n"
              "    name: &'a str,\n"
              "    root: &'a Path,\n"
              "}\n\n"
              "fn confirmation_token(\n"
              "    project: ProjectConfirmationBinding<'_>,\n"
          )

          if call_old not in text:
              raise SystemExit("confirmation call binding pattern not found")
          if signature_old not in text:
              raise SystemExit("confirmation signature pattern not found")

          text = text.replace(call_old, call_new, 1)
          text = text.replace(signature_old, signature_new, 1)
          text = text.replace("hasher.update(project.as_bytes());", "hasher.update(project.name.as_bytes());", 1)
          text = text.replace(
              "hasher.update(project_root.as_os_str().to_string_lossy().as_bytes());",
              "hasher.update(project.root.as_os_str().to_string_lossy().as_bytes());",
              1,
          )
          path.write_text(text)
      - name: Format
        run: cargo fmt --all
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Tests
        run: cargo test --workspace
      - name: Commit verified fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/repodesk-core/src/language_tools.rs
          if git diff --cached --quiet; then
            echo "No source changes to commit"
            exit 0
          fi
          git commit -m "fix(language): satisfy strict clippy gate"
          git push origin HEAD:fix/language-managed-tools-ci
