name: Release

# Push a tag like `v1.0.0` to build installers for every platform and open a
# draft GitHub Release with the artifacts attached. Keep tauri.conf.json
# `version` in sync with the tag (see docs/RELEASE_CHECKLIST.md).
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest        # Apple Silicon
            args: '--target aarch64-apple-darwin'
          - platform: macos-latest        # Intel
            args: '--target x86_64-apple-darwin'
          - platform: ubuntu-22.04         # Linux (.AppImage / .deb)
            args: ''
          - platform: windows-latest       # Windows (.msi / .exe)
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Tauri system dependencies (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml

      - name: Install frontend deps
        run: pnpm --dir apps/desktop install --frozen-lockfile

      - name: Build, bundle, and draft release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signing/notarization secrets slot in here later (N3) — unset = unsigned build.
        with:
          projectPath: apps/desktop
          tagName: ${{ github.ref_name }}
          releaseName: 'RepoDesk ${{ github.ref_name }}'
          releaseBody: 'Download the installer for your platform from the assets below. Unsigned build — see docs/RELEASE_CHECKLIST.md.'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
