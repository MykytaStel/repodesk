name: Release

# Push a tag like `v1.0.0` to build installers for every platform and open a
# draft GitHub Release with the artifacts attached. Keep tauri.conf.json
# `version` in sync with the tag (see docs/RELEASE_CHECKLIST.md).
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  # Guard: a release tag must match tauri.conf.json's version, or the updater
  # advertises a version users never see. Fails fast before any build.
  version-check:
    name: Tag ↔ version sync
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Check tag matches configured version
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            ./scripts/check-version-sync.sh "${{ github.ref_name }}"
          else
            echo "Not a tag (manual dispatch) — skipping version-sync guard."
          fi

  release:
    needs: version-check
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest        # Apple Silicon
            args: '--target aarch64-apple-darwin'
          - platform: macos-latest        # Intel
            args: '--target x86_64-apple-darwin'
          - platform: ubuntu-22.04         # Linux (.AppImage / .deb)
            args: ''
          - platform: windows-latest       # Windows (.msi / .exe)
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Tauri system dependencies (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml

      - name: Install frontend deps
        run: pnpm --dir apps/desktop install --frozen-lockfile

      - name: Build, bundle, and draft release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Auto-updater signing. Required for updater artifacts (.sig + latest.json)
          # to be produced/uploaded; the public key lives in tauri.conf.json. Generate
          # with `tauri signer generate` and store the private key + password as secrets
          # (see docs/RELEASE_CHECKLIST.md §6).
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # macOS Developer ID signing + notarization. DORMANT until these secrets
          # are added: when unset, tauri-action produces an unsigned build (no error);
          # when set, it signs + notarizes automatically. See RELEASE_CHECKLIST.md §5.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          projectPath: apps/desktop
          tagName: ${{ github.ref_name }}
          releaseName: 'RepoDesk ${{ github.ref_name }}'
          releaseBody: 'Download the installer for your platform from the assets below. See docs/RELEASE_CHECKLIST.md.'
          releaseDraft: true
          prerelease: false
          # Upload the updater manifest (latest.json) so the GitHub Releases endpoint
          # in tauri.conf.json resolves. No-op without the signing key above.
          includeUpdaterJson: true
          args: ${{ matrix.args }}

  # Release evidence must include a machine-readable dependency inventory. Run
  # after the cross-platform build so the draft Release exists before the action
  # attaches the SPDX document. Pin the third-party action to the immutable
  # v0.24.0 commit rather than a moving major tag.
  sbom:
    name: Generate release SBOM
    needs: release
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-22.04
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Generate and attach SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: .
          format: spdx-json
          artifact-name: repodesk-${{ github.ref_name }}.spdx.json
          output-file: repodesk-${{ github.ref_name }}.spdx.json
          upload-artifact: true
          upload-release-assets: true

  # N4: fail loudly if the cross-platform matrix didn't attach every installer
  # (or, when signing is active, if latest.json doesn't cover all four platforms).
  # Waiting for `sbom` also guarantees the dependency evidence is attached before
  # this release reaches its final verification stage.
  verify-release:
    name: Verify all platform artifacts attached
    needs: [release, sbom]
    # Only meaningful for tag releases (a manual dispatch has no published tag release).
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Verify release artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/verify-release-artifacts.sh "${{ github.ref_name }}"
