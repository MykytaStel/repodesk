name: Editor Theme Integrate

on:
  push:
    branches:
      - fix/code-editor-theme-integration
    paths:
      - .github/workflows/editor-theme-integrate.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/code-editor-theme-integration
          fetch-depth: 0
      - name: Synchronize CodeMirror with resolved RepoDesk theme
        shell: python
        run: |
          from pathlib import Path

          path = Path("apps/desktop/src/features/code/SemanticCodeEditor.tsx")
          text = path.read_text()

          old = '''const editorTheme = EditorView.theme({'''
          new = '''const editorThemeSpec = {'''
          if old not in text:
              raise SystemExit("editorTheme declaration not found")
          text = text.replace(old, new, 1)

          old = '''  ".cm-tooltip": {\n    backgroundColor: "var(--surface)",\n    color: "var(--text)",\n    border: "1px solid var(--border-strong)",\n  },\n}, { dark: true });\n'''
          new = '''  ".cm-tooltip": {\n    backgroundColor: "var(--surface)",\n    color: "var(--text)",\n    border: "1px solid var(--border-strong)",\n  },\n};\n\ntype EditorThemeMode = "light" | "dark";\n\nconst lightEditorTheme = EditorView.theme(editorThemeSpec);\nconst darkEditorTheme = EditorView.theme(editorThemeSpec, { dark: true });\n\nfunction resolvedEditorThemeMode(): EditorThemeMode {\n  if (typeof document === "undefined") return "dark";\n  return document.documentElement.getAttribute("data-theme") === "light" ? "light" : "dark";\n}\n\nfunction editorThemeExtension(mode: EditorThemeMode): Extension {\n  return mode === "light" ? lightEditorTheme : darkEditorTheme;\n}\n'''
          if old not in text:
              raise SystemExit("editorTheme closing block not found")
          text = text.replace(old, new, 1)

          old = '''  const gitCompartmentRef = useRef<Compartment | null>(null);\n  const onChangeRef = useRef(onChange);'''
          new = '''  const gitCompartmentRef = useRef<Compartment | null>(null);\n  const themeCompartmentRef = useRef<Compartment | null>(null);\n  const onChangeRef = useRef(onChange);'''
          if old not in text:
              raise SystemExit("theme compartment ref insertion point not found")
          text = text.replace(old, new, 1)

          old = '''  if (!gitCompartmentRef.current) gitCompartmentRef.current = new Compartment();\n  const gitCompartment = gitCompartmentRef.current;\n'''
          new = '''  if (!gitCompartmentRef.current) gitCompartmentRef.current = new Compartment();\n  if (!themeCompartmentRef.current) themeCompartmentRef.current = new Compartment();\n  const gitCompartment = gitCompartmentRef.current;\n  const themeCompartment = themeCompartmentRef.current;\n'''
          if old not in text:
              raise SystemExit("theme compartment init target not found")
          text = text.replace(old, new, 1)

          old = '''        definitionLinkField,\n        editorTheme,\n        EditorState.tabSize.of(2),'''
          new = '''        definitionLinkField,\n        themeCompartment.of(editorThemeExtension(resolvedEditorThemeMode())),\n        EditorState.tabSize.of(2),'''
          if old not in text:
              raise SystemExit("editor theme extension target not found")
          text = text.replace(old, new, 1)

          old = '''    const view = new EditorView({ state, parent: host });\n    viewRef.current = view;\n    view.dispatch(setDiagnostics(view.state, codeMirrorDiagnostics(view.state, semantic)));\n\n    const applyPendingLocation = () => {'''
          new = '''    const view = new EditorView({ state, parent: host });\n    viewRef.current = view;\n    view.dispatch(setDiagnostics(view.state, codeMirrorDiagnostics(view.state, semantic)));\n\n    let themeMode = resolvedEditorThemeMode();\n    host.dataset.editorTheme = themeMode;\n    const syncEditorTheme = () => {\n      const nextMode = resolvedEditorThemeMode();\n      if (nextMode === themeMode) return;\n      themeMode = nextMode;\n      host.dataset.editorTheme = nextMode;\n      view.dispatch({ effects: themeCompartment.reconfigure(editorThemeExtension(nextMode)) });\n    };\n    const themeObserver = new MutationObserver(syncEditorTheme);\n    themeObserver.observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });\n\n    const applyPendingLocation = () => {'''
          if old not in text:
              raise SystemExit("theme observer insertion point not found")
          text = text.replace(old, new, 1)

          old = '''      window.removeEventListener("blur", onWindowBlur);\n      modifierDownRef.current = false;'''
          new = '''      window.removeEventListener("blur", onWindowBlur);\n      themeObserver.disconnect();\n      modifierDownRef.current = false;'''
          if old not in text:
              raise SystemExit("theme observer cleanup target not found")
          text = text.replace(old, new, 1)

          old = '''  }, [gitCompartment, language, path, readOnly]);'''
          new = '''  }, [gitCompartment, language, path, readOnly, themeCompartment]);'''
          if old not in text:
              raise SystemExit("editor effect deps target not found")
          text = text.replace(old, new, 1)

          path.write_text(text)
          Path(".github/workflows/editor-theme-integrate.yml").unlink()
      - name: Verify frontend and commit
        run: |
          corepack enable
          corepack prepare pnpm@10.33.2 --activate
          pnpm --dir apps/desktop install --frozen-lockfile
          pnpm --dir apps/desktop build
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(code): sync CodeMirror with shell theme"
          git push origin HEAD:fix/code-editor-theme-integration
