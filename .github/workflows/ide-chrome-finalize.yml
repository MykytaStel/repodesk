name: IDE chrome finalizer

on:
  push:
    branches:
      - ux/code-ide-chrome

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ux/code-ide-chrome
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml
      - name: Apply IDE chrome integration
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path: str, old: str, new: str):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              assert count == 1, f"{path}: expected one occurrence, found {count}: {old[:80]!r}"
              p.write_text(text.replace(old, new, 1))

          code_tab = Path("apps/desktop/src/features/code/CodeTab.tsx")
          text = code_tab.read_text()
          text = text.replace(
              'import { CodeWorkspaceActions } from "./CodeWorkspaceActions";',
              'import { useCodeWorkspaceActions } from "./CodeWorkspaceActions";',
              1,
          )
          text = text.replace(
              'import { CodeWorkspaceTree } from "./CodeWorkspaceTree";\n',
              'import { CodeWorkspaceTree } from "./CodeWorkspaceTree";\nimport { IdeIcon } from "./IdeIcon";\nimport { useIdePreferences } from "./idePreferences";\n',
              1,
          )
          text = text.replace(
              'import "./code-workspace.css";\n',
              'import "./code-workspace.css";\nimport "./ide-chrome.css";\n',
              1,
          )
          marker = '  const dirtyCount = tabs.filter((tab) => tab.dirty).length;\n'
          assert marker in text
          text = text.replace(marker, marker + '  const idePreferences = useIdePreferences();\n', 1)

          hook_marker = '  }, [refreshMutationProjections, tabs]);\n\n  if (!hasProject) {'
          assert hook_marker in text
          hook = '''  }, [refreshMutationProjections, tabs]);

  const workspaceActions = useCodeWorkspaceActions({
    getOpenDocument: (path) => {
      const tab = tabs.find((candidate) => candidate.kind === "workspace" && candidate.path === path);
      return tab ? { path: tab.path, fingerprint: tab.fingerprint, dirty: tab.dirty } : null;
    },
    onMutation: handleWorkspaceMutation,
    onError: setWorkspaceError,
    preferences: idePreferences,
  });

  if (!hasProject) {'''
          text = text.replace(hook_marker, hook, 1)

          old_tree = '<CodeWorkspaceTree files={workspace.data.files} activePath={activePath} onOpen={(file) => void openFile(file)} />'
          assert old_tree in text
          new_tree = '''<CodeWorkspaceTree
          files={workspace.data.files}
          activePath={activePath}
          onOpen={(file) => void openFile(file)}
          onSearchProject={() => setSideMode("search")}
          onNewFile={workspaceActions.requestCreateFile}
          onNewFolder={workspaceActions.requestCreateDirectory}
          onRename={workspaceActions.requestRename}
          onDelete={workspaceActions.requestDelete}
          onRefresh={() => void workspace.refetch()}
          isPathDirty={(path) => tabs.some((tab) => tab.kind === "workspace" && tab.path === path && tab.dirty)}
        />'''
          text = text.replace(old_tree, new_tree, 1)

          side_end = '''      )}

      <section className="code-editor-workbench">'''
          assert side_end in text
          text = text.replace(side_end, '''      )}

      {workspaceActions.dialog}

      <section className="code-editor-workbench">''', 1)

          start = text.index('          <div className="code-workspace-actions">')
          end_marker = '          </div>\n        </header>'
          end = text.index(end_marker, start)
          old_actions = text[start:end + len('          </div>')]
          new_actions = '''          <div className="code-workspace-actions ide-icon-toolbar" role="toolbar" aria-label="Code workspace actions">
            {activeTab?.kind === "workspace" ? (
              <button
                type="button"
                className={`ide-icon-button${repoIntelOpen ? " active" : ""}`}
                aria-label="Repository context"
                title="Repository context"
                onClick={() => {
                  setRepoIntelOpen((open) => !open);
                  setInsightsOpen(false);
                }}
              >
                <IdeIcon name="context" />
              </button>
            ) : null}
            <button
              type="button"
              className="ide-icon-button"
              aria-label={review.isPending ? "Analyzing changes" : "Analyze changes"}
              title={review.isPending ? "Analyzing changes…" : "Analyze changes"}
              disabled={review.isPending}
              onClick={() => review.mutate()}
            >
              <IdeIcon name="analyze" />
            </button>
            {review.data ? (
              <button
                type="button"
                className={`ide-icon-button${insightsOpen ? " active" : ""}`}
                aria-label={`Findings ${review.data.total}`}
                title={`${review.data.total} engineering findings`}
                onClick={() => {
                  setInsightsOpen((open) => !open);
                  setRepoIntelOpen(false);
                }}
              >
                <IdeIcon name="more" />
                <span className="ide-icon-count">{review.data.total > 99 ? "99+" : review.data.total}</span>
              </button>
            ) : null}
            <button
              type="button"
              className="ide-icon-button"
              aria-label={activeTab?.kind === "workspace" ? "Review file change" : "Review changes"}
              title={activeTab?.kind === "workspace" ? "Review file change" : "Review changes"}
              onClick={openChanges}
            >
              <IdeIcon name="changes" />
            </button>
          </div>'''
          text = text[:start] + new_actions + text[end + len('          </div>'):]
          code_tab.write_text(text)

          tree = Path("apps/desktop/src/features/code/CodeWorkspaceTree.tsx")
          text = tree.read_text()
          text = text.replace('  onRefresh,\n}: {', '  onRefresh,\n  isPathDirty,\n}: {', 1)
          text = text.replace('  onRefresh: () => void;\n}) {', '  onRefresh: () => void;\n  isPathDirty: (path: string) => boolean;\n}) {', 1)
          text = text.replace(
              'onContextMenu={(event) => openContextMenu(event, { kind: "file", path: file.path }, Boolean(file.blocked))}',
              'onContextMenu={(event) => openContextMenu(event, { kind: "file", path: file.path }, Boolean(file.blocked) || isPathDirty(file.path))}',
              1,
          )
          tree.write_text(text)

          panel = Path("apps/desktop/src/features/settings/IdePreferencesPanel.tsx")
          text = panel.read_text()
          if 'import "../code/ide-chrome.css";' not in text:
              text = text.replace(
                  'import { useIdePreferences, saveIdePreferences, resetIdePreferences } from "../code/idePreferences";\n',
                  'import { useIdePreferences, saveIdePreferences, resetIdePreferences } from "../code/idePreferences";\nimport "../code/ide-chrome.css";\n',
                  1,
              )
          panel.write_text(text)

          settings = Path("apps/desktop/src/features/settings/SettingsTab.tsx")
          text = settings.read_text()
          text = text.replace(
              'import { ProjectAiImportPanel } from "./ProjectAiImportPanel";\n',
              'import { ProjectAiImportPanel } from "./ProjectAiImportPanel";\nimport { IdePreferencesPanel } from "./IdePreferencesPanel";\n',
              1,
          )
          provider_marker = '      <section className="panel wide-panel">\n        <div className="panel-title-row"><div><p className="eyebrow">Provider settings</p><h2>Runtime configuration</h2></div>'
          assert provider_marker in text
          text = text.replace(provider_marker, '      <IdePreferencesPanel />\n\n' + provider_marker, 1)
          settings.write_text(text)

          editor = Path("apps/desktop/src/features/code/SemanticCodeEditor.tsx")
          text = editor.read_text()
          text = text.replace(
              'import { editorLanguageExtension, loadEditorLanguageExtension } from "./editorLanguages";\n',
              'import { editorLanguageExtension, loadEditorLanguageExtension } from "./editorLanguages";\nimport { useIdePreferences, type IdePreferences } from "./idePreferences";\n',
              1,
          )
          theme_marker = '''function editorThemeExtension(mode: EditorThemeMode): Extension {
  return mode === "light" ? lightEditorTheme : darkEditorTheme;
}
'''
          assert theme_marker in text
          preference_helper = theme_marker + '''
function editorPreferencesExtension(preferences: IdePreferences): Extension {
  return [
    EditorState.tabSize.of(preferences.tabSize),
    preferences.wordWrap ? EditorView.lineWrapping : [],
    EditorView.theme({
      "&": { fontSize: `${preferences.editorFontSize}px` },
      ".cm-content": { fontSize: "inherit" },
      ".cm-gutters": { fontSize: `${Math.max(10, preferences.editorFontSize - 1)}px` },
    }),
  ];
}
'''
          text = text.replace(theme_marker, preference_helper, 1)
          text = text.replace(
              '  const { hasProject, projectName } = useWorkspace();\n',
              '  const { hasProject, projectName } = useWorkspace();\n  const idePreferences = useIdePreferences();\n',
              1,
          )
          text = text.replace(
              '  const languageCompartmentRef = useRef<Compartment | null>(null);\n',
              '  const languageCompartmentRef = useRef<Compartment | null>(null);\n  const preferenceCompartmentRef = useRef<Compartment | null>(null);\n',
              1,
          )
          text = text.replace(
              '  if (!languageCompartmentRef.current) languageCompartmentRef.current = new Compartment();\n',
              '  if (!languageCompartmentRef.current) languageCompartmentRef.current = new Compartment();\n  if (!preferenceCompartmentRef.current) preferenceCompartmentRef.current = new Compartment();\n',
              1,
          )
          text = text.replace(
              '  const languageCompartment = languageCompartmentRef.current;\n',
              '  const languageCompartment = languageCompartmentRef.current;\n  const preferenceCompartment = preferenceCompartmentRef.current;\n',
              1,
          )
          text = text.replace(
              '        EditorState.tabSize.of(2),\n',
              '        preferenceCompartment.of(editorPreferencesExtension(idePreferences)),\n',
              1,
          )
          text = text.replace(
              '  }, [gitCompartment, language, languageCompartment, path, readOnly, themeCompartment]);\n\n  useEffect(() => {\n    const view = viewRef.current;\n    if (!view) return;\n    const current = view.state.doc.toString();',
              '''  }, [gitCompartment, language, languageCompartment, path, preferenceCompartment, readOnly, themeCompartment]);

  useEffect(() => {
    const view = viewRef.current;
    if (!view) return;
    view.dispatch({
      effects: preferenceCompartment.reconfigure(editorPreferencesExtension(idePreferences)),
    });
  }, [idePreferences, preferenceCompartment]);

  useEffect(() => {
    const view = viewRef.current;
    if (!view) return;
    const current = view.state.doc.toString();''',
              1,
          )
          editor.write_text(text)

          test = Path("apps/desktop/e2e/code-file-ops-ui.spec.ts")
          test.write_text('''import { expect, test } from "@playwright/test";
import { onboardedFixtures } from "./fixtures";
import { installMockIpc, recordedInvocations } from "./mock-ipc";

const createdSource = "export const created = true;\\n";

const fileOpsFixtures = {
  ...onboardedFixtures,
  code_workspace_create_file: {
    path: "src/created.ts",
    previous_path: null,
    kind: "file_created",
    language: "typescript",
  },
  code_workspace_read: {
    path: "src/created.ts",
    content: createdSource,
    bytes: createdSource.length,
    line_count: 1,
    language: "typescript",
    status: "untracked",
    fingerprint: "created-file-fingerprint",
  },
  "language_intelligence_snapshot:snapshot": {
    project: "RepoDesk",
    primary_language: "typescript",
    available_count: 0,
    generated_at: "2026-08-12T20:00:00Z",
    servers: [],
  },
};

test.describe("Code workspace IDE actions", () => {
  test("creates a repository file through the Explorer icon and RepoDesk dialog", async ({ page }) => {
    await installMockIpc(page, fileOpsFixtures);
    await page.goto("/");
    await page.getByRole("button", { name: /^Code —/ }).click();

    await page.getByRole("button", { name: "New file" }).click();
    const dialog = page.getByRole("dialog", { name: "New file" });
    await expect(dialog).toBeVisible();
    await dialog.getByRole("textbox").fill("src/created.ts");
    await dialog.getByRole("button", { name: "Create" }).click();

    await expect(page.getByRole("tab", { name: /created.ts/ })).toBeVisible();
    await expect(page.locator(".code-document-location")).toContainText("src/created.ts");
    await expect(page.locator(".semantic-code-editor-host .cm-content")).toContainText("export const created = true");

    const invocations = await recordedInvocations(page);
    expect(invocations).toContainEqual({
      cmd: "code_workspace_create_file",
      args: { input: { path: "src/created.ts", content: "" } },
    });
  });

  test("shows Explorer right-click actions and blocks destructive actions for dirty files", async ({ page }) => {
    await installMockIpc(page, onboardedFixtures);
    await page.goto("/");
    await page.getByRole("button", { name: /^Code —/ }).click();

    const row = page.getByRole("treeitem", { name: /.gitignore/ });
    await row.click();
    await row.click({ button: "right" });
    const menu = page.getByRole("menu", { name: /Explorer actions for .gitignore/ });
    await expect(menu).toBeVisible();
    await expect(menu.getByRole("menuitem", { name: "Rename…" })).toBeEnabled();
    await expect(menu.getByRole("menuitem", { name: "Delete" })).toBeEnabled();
    await expect(menu.getByRole("menuitem", { name: "Copy Relative Path" })).toBeVisible();
    await page.keyboard.press("Escape");
    await expect(menu).toBeHidden();

    await page.locator(".semantic-code-editor-host .cm-content").press("x");
    await row.click({ button: "right" });
    await expect(menu.getByRole("menuitem", { name: "Rename…" })).toBeDisabled();
    await expect(menu.getByRole("menuitem", { name: "Delete" })).toBeDisabled();
  });
});
''')

      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: pnpm install --frozen-lockfile
      - name: Build frontend
        working-directory: apps/desktop
        run: pnpm build
      - name: Install Playwright Chromium
        working-directory: apps/desktop
        run: pnpm exec playwright install --with-deps chromium
      - name: Run focused IDE chrome E2E
        working-directory: apps/desktop
        run: pnpm e2e code-file-ops-ui.spec.ts
      - name: Commit product changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/desktop/src/features/code apps/desktop/src/features/settings apps/desktop/e2e/code-file-ops-ui.spec.ts
          git diff --cached --quiet && exit 0
          git commit -m "ux(code): integrate IDE explorer chrome"
          git push origin HEAD:ux/code-ide-chrome
