name: IDE chrome finalizer

on:
  push:
    branches:
      - ux/code-ide-chrome

permissions:
  contents: write

jobs:
  finalize:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ux/code-ide-chrome
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml

      - name: Apply integration patch
        run: python3 .github/scripts/finalize_ide_chrome.py

      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        working-directory: apps/desktop
        run: pnpm build

      - name: Install Chromium
        working-directory: apps/desktop
        run: pnpm exec playwright install --with-deps chromium

      - name: Run focused IDE chrome E2E
        working-directory: apps/desktop
        run: pnpm e2e code-file-ops-ui.spec.ts

      - name: Commit product changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/desktop/src/features/code apps/desktop/src/features/settings apps/desktop/e2e/code-file-ops-ui.spec.ts
          git diff --cached --quiet && exit 0
          git commit -m "ux(code): integrate IDE explorer chrome"
          git push origin HEAD:ux/code-ide-chrome
