name: Dev stage reserved evidence boundary

on:
  push:
    branches:
      - fix/execution-evidence-truth
    paths:
      - scripts/dev-stage-reserved-evidence-boundary.py
      - .github/workflows/dev-stage-reserved-evidence-boundary.yml

permissions:
  contents: write

jobs:
  red:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/execution-evidence-truth
          fetch-depth: 0
      - name: Stage architecture regression
        run: python3 scripts/dev-stage-reserved-evidence-boundary.py
      - name: Confirm RED
        shell: bash
        run: |
          set +e
          node --test scripts/check-source-architecture.test.mjs 2>&1 | tee /tmp/red.log
          code=${PIPESTATUS[0]}
          set -e
          if [ "$code" -eq 0 ]; then
            echo "Expected reserved-id evidence boundary regression to fail before implementation"
            exit 1
          fi
          grep -Eq "reserved-id execution|evidence-aware public wrapper|receipt finalization" /tmp/red.log
      - name: Remove development helpers
        run: |
          rm scripts/dev-stage-reserved-evidence-boundary.py
          rm .github/workflows/dev-stage-reserved-evidence-boundary.yml
      - name: Commit RED regression
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "test: keep reserved runs behind evidence boundary"
          git push origin HEAD:fix/execution-evidence-truth
