name: Architecture Ratchet

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  source-architecture:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22

      - name: Test architecture ratchet
        run: node --test scripts/*.test.mjs

      - name: Enforce source architecture budget
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node scripts/check-source-architecture.mjs
