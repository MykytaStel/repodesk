name: Architecture Ratchet

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  source-architecture:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22

      - name: Test architecture ratchet
        run: node --test scripts/check-source-architecture.test.mjs

      - name: Enforce source architecture budget
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node scripts/check-source-architecture.mjs
