name: Temporary PR157 cache revision migration

on:
  push:
    branches:
      - fix/canonical-engineering-event-ledger

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/canonical-engineering-event-ledger
          fetch-depth: 1

      - name: Apply scoped canonical revision migration
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one marker, found {count}")
              file.write_text(text.replace(old, new, 1))

          # Keep the canonical revision query in a focused submodule instead of
          # growing the already-large event_journal.rs implementation.
          revision = Path("crates/repodesk-core/src/persistence/event_journal/revision.rs")
          revision.parent.mkdir(parents=True, exist_ok=True)
          if revision.exists():
              raise SystemExit("revision.rs already exists")
          revision.write_text('''use rusqlite::{OptionalExtension, params};

use crate::errors::RepoDeskResult;
use crate::persistence::db::init_db;

use super::{db_err, ensure_legacy_jsonl_import};

/// Cheap identity for the latest canonical event in one Work Item.
///
/// This is intentionally scoped so an unrelated Work Item does not invalidate
/// observational caches. It does not replace full hash-chain verification when
/// events are actually replayed.
#[derive(Debug, Clone, PartialEq, Eq)]
pub struct EngineeringEventRevision {
    pub sequence: i64,
    pub event_hash: String,
}

pub fn engineering_event_revision(
    project: &str,
    work_item_id: &str,
) -> RepoDeskResult<Option<EngineeringEventRevision>> {
    ensure_legacy_jsonl_import()?;
    let conn = init_db()?;
    conn.query_row(
        "SELECT sequence, event_hash
         FROM engineering_events
         WHERE project = ?1 AND work_item_id = ?2
         ORDER BY sequence DESC
         LIMIT 1",
        params![project, work_item_id],
        |row| {
            Ok(EngineeringEventRevision {
                sequence: row.get(0)?,
                event_hash: row.get(1)?,
            })
        },
    )
    .optional()
    .map_err(|error| db_err("Failed to read Work Item event revision", error))
}
''')

          replace_once(
              "crates/repodesk-core/src/persistence/event_journal.rs",
              "use crate::tasks::show_active_task;\n\nconst EVENT_SCHEMA_VERSION: i64 = 1;",
              "use crate::tasks::show_active_task;\n\nmod revision;\npub use revision::{EngineeringEventRevision, engineering_event_revision};\n\nconst EVENT_SCHEMA_VERSION: i64 = 1;",
          )

          replace_once(
              "crates/repodesk-core/src/engineering/events.rs",
              "use crate::persistence::event_journal::{\n    EngineeringEventInput, append_engineering_event, read_engineering_events,\n};",
              "use crate::persistence::event_journal::{\n    EngineeringEventInput, append_engineering_event, engineering_event_revision,\n    read_engineering_events,\n};",
          )

          replace_once(
              "crates/repodesk-core/src/engineering/events.rs",
              "pub fn event_ledger_path(run_dir: &Path) -> PathBuf {\n    run_dir.join(ENGINEERING_EVENT_LEDGER_FILE)\n}\n\n/// Append one typed engineering event",
              '''pub fn event_ledger_path(run_dir: &Path) -> PathBuf {
    run_dir.join(ENGINEERING_EVENT_LEDGER_FILE)
}

#[derive(Debug, Clone, PartialEq, Eq)]
pub struct EventLedgerRevision {
    pub sequence: i64,
    pub event_hash: String,
}

fn event_scope(run_dir: &Path) -> (Option<String>, Option<String>) {
    let work_item_id = run_dir
        .file_name()
        .map(|value| value.to_string_lossy().to_string());
    let project = run_dir
        .parent()
        .and_then(Path::file_name)
        .map(|value| value.to_string_lossy().to_string());
    (project, work_item_id)
}

/// Return the latest canonical revision for the Work Item represented by
/// `run_dir` without replaying or allocating its event history.
pub fn event_ledger_revision(run_dir: &Path) -> RepoDeskResult<Option<EventLedgerRevision>> {
    let (project, work_item_id) = event_scope(run_dir);
    let (Some(project), Some(work_item_id)) = (project, work_item_id) else {
        return Ok(None);
    };

    Ok(engineering_event_revision(&project, &work_item_id)?.map(|revision| {
        EventLedgerRevision {
            sequence: revision.sequence,
            event_hash: revision.event_hash,
        }
    }))
}

/// Append one typed engineering event''',
          )

          replace_once(
              "crates/repodesk-core/src/engineering/events.rs",
              '''pub fn read_events(run_dir: &Path) -> RepoDeskResult<Vec<EngineeringEvent>> {
    let task_id = run_dir
        .file_name()
        .map(|value| value.to_string_lossy().to_string());
    let project = run_dir
        .parent()
        .and_then(Path::file_name)
        .map(|value| value.to_string_lossy().to_string());

    let mut canonical = read_engineering_events(usize::MAX)?''',
              '''pub fn read_events(run_dir: &Path) -> RepoDeskResult<Vec<EngineeringEvent>> {
    let (project, task_id) = event_scope(run_dir);

    let mut canonical = read_engineering_events(usize::MAX)?''',
          )

          replace_once(
              "crates/repodesk-core/src/engineering/mod.rs",
              '''pub use events::{
    ENGINEERING_EVENT_LEDGER_FILE, EngineeringEvent, EngineeringEventKind, append_event,
    event_ledger_path, read_events,
};''',
              '''pub use events::{
    ENGINEERING_EVENT_LEDGER_FILE, EngineeringEvent, EngineeringEventKind, EventLedgerRevision,
    append_event, event_ledger_path, event_ledger_revision, read_events,
};''',
          )

          replace_once(
              "apps/desktop/src-tauri/Cargo.toml",
              "[dev-dependencies]\ntempfile.workspace = true\n",
              "[dev-dependencies]\nserial_test = \"3\"\ntempfile.workspace = true\n",
          )

          cache_path = Path("apps/desktop/src-tauri/src/commands/engineering_projection_cache.rs")
          cache = cache_path.read_text()
          cache = cache.replace(
              '''    derive_ai_usage_report, derive_engineering_intelligence, derive_strategy_feedback,
    event_ledger_path, read_events,
};''',
              '''    EventLedgerRevision, derive_ai_usage_report, derive_engineering_intelligence,
    derive_strategy_feedback, event_ledger_path, event_ledger_revision, read_events,
};''',
              1,
          )
          if "EventLedgerRevision" not in cache:
              raise SystemExit("cache import replacement failed")

          old_stamp = '''struct LedgerStamp {
    path: PathBuf,
    exists: bool,
    len: u64,
    modified: Option<SystemTime>,
}'''
          new_stamp = '''struct LedgerStamp {
    path: PathBuf,
    canonical: Option<EventLedgerRevision>,
    legacy_exists: bool,
    legacy_len: u64,
    legacy_modified: Option<SystemTime>,
}'''
          if cache.count(old_stamp) != 1:
              raise SystemExit("cache LedgerStamp marker mismatch")
          cache = cache.replace(old_stamp, new_stamp, 1)

          old_fn = '''fn ledger_stamp(run_dir: &Path) -> RepoDeskResult<LedgerStamp> {
    let path = event_ledger_path(run_dir);
    match fs::metadata(&path) {
        Ok(metadata) => Ok(LedgerStamp {
            path,
            exists: true,
            len: metadata.len(),
            modified: metadata.modified().ok(),
        }),
        Err(error) if error.kind() == std::io::ErrorKind::NotFound => Ok(LedgerStamp {
            path,
            exists: false,
            len: 0,
            modified: None,
        }),
        Err(error) => Err(error.into()),
    }
}'''
          new_fn = '''fn ledger_stamp(run_dir: &Path) -> RepoDeskResult<LedgerStamp> {
    let path = event_ledger_path(run_dir);
    let canonical = event_ledger_revision(run_dir)?;
    match fs::metadata(&path) {
        Ok(metadata) => Ok(LedgerStamp {
            path,
            canonical,
            legacy_exists: true,
            legacy_len: metadata.len(),
            legacy_modified: metadata.modified().ok(),
        }),
        Err(error) if error.kind() == std::io::ErrorKind::NotFound => Ok(LedgerStamp {
            path,
            canonical,
            legacy_exists: false,
            legacy_len: 0,
            legacy_modified: None,
        }),
        Err(error) => Err(error.into()),
    }
}'''
          if cache.count(old_fn) != 1:
              raise SystemExit("cache ledger_stamp marker mismatch")
          cache = cache.replace(old_fn, new_fn, 1)

          test_marker = "#[cfg(test)]\nmod tests {"
          if cache.count(test_marker) != 1:
              raise SystemExit("cache tests marker mismatch")
          production = cache.split(test_marker, 1)[0]
          tests = r'''#[cfg(test)]
mod tests {
    use super::*;
    use repodesk_core::engineering::{
        EngineeringEvent, EngineeringEventKind, WorkItemId, append_event,
    };
    use serial_test::serial;
    use tempfile::TempDir;

    const PROJECT: &str = "RepoDesk";

    fn isolated_home() -> TempDir {
        let home = tempfile::tempdir().unwrap();
        // SAFETY: every test in this module is serialized because REPODESK_HOME
        // is process-global.
        unsafe {
            std::env::set_var("REPODESK_HOME", home.path());
        }
        repodesk_core::init::init_home().unwrap();
        home
    }

    fn run_dir(home: &TempDir, work_item_id: &str) -> PathBuf {
        let run_dir = home.path().join("runs").join(PROJECT).join(work_item_id);
        fs::create_dir_all(&run_dir).unwrap();
        run_dir
    }

    fn event(work_item_id: &str, kind: EngineeringEventKind) -> EngineeringEvent {
        EngineeringEvent::new(
            PROJECT,
            WorkItemId::try_new(work_item_id).unwrap(),
            kind,
        )
    }

    #[test]
    #[serial]
    fn unchanged_ledger_reuses_the_same_projection_snapshot() {
        let home = isolated_home();
        let run_dir = run_dir(&home, "task-cache");
        append_event(
            &run_dir,
            &event("task-cache", EngineeringEventKind::WorkItemCreated),
        )
        .unwrap();

        let first = load_engineering_projection(&run_dir).unwrap();
        let second = load_engineering_projection(&run_dir).unwrap();

        assert!(Arc::ptr_eq(&first, &second));
        assert_eq!(first.intelligence.event_count, 1);
    }

    #[test]
    #[serial]
    fn appended_event_invalidates_cached_projection() {
        let home = isolated_home();
        let run_dir = run_dir(&home, "task-cache");
        append_event(
            &run_dir,
            &event("task-cache", EngineeringEventKind::WorkItemCreated),
        )
        .unwrap();
        let first = load_engineering_projection(&run_dir).unwrap();

        append_event(
            &run_dir,
            &event("task-cache", EngineeringEventKind::ContextBuilt),
        )
        .unwrap();
        let second = load_engineering_projection(&run_dir).unwrap();

        assert!(!Arc::ptr_eq(&first, &second));
        assert_eq!(second.intelligence.event_count, 2);
    }

    #[test]
    #[serial]
    fn unrelated_work_item_does_not_invalidate_cached_projection() {
        let home = isolated_home();
        let first_dir = run_dir(&home, "task-cache-a");
        let second_dir = run_dir(&home, "task-cache-b");
        append_event(
            &first_dir,
            &event("task-cache-a", EngineeringEventKind::WorkItemCreated),
        )
        .unwrap();
        let first = load_engineering_projection(&first_dir).unwrap();

        append_event(
            &second_dir,
            &event("task-cache-b", EngineeringEventKind::ContextBuilt),
        )
        .unwrap();
        let first_again = load_engineering_projection(&first_dir).unwrap();

        assert!(Arc::ptr_eq(&first, &first_again));
        assert_eq!(first_again.intelligence.event_count, 1);
    }

    #[test]
    #[serial]
    fn changed_corrupt_legacy_ledger_is_not_hidden_by_previous_cache_entry() {
        let home = isolated_home();
        let run_dir = run_dir(&home, "task-cache");
        append_event(
            &run_dir,
            &event("task-cache", EngineeringEventKind::WorkItemCreated),
        )
        .unwrap();
        load_engineering_projection(&run_dir).unwrap();

        fs::write(
            event_ledger_path(&run_dir),
            "{not-json}\nmore-corruption\n",
        )
        .unwrap();

        assert!(load_engineering_projection(&run_dir).is_err());
    }

    #[test]
    #[serial]
    fn different_work_items_keep_independent_cache_entries() {
        let home = isolated_home();
        let first_dir = run_dir(&home, "task-cache-a");
        let second_dir = run_dir(&home, "task-cache-b");
        append_event(
            &first_dir,
            &event("task-cache-a", EngineeringEventKind::WorkItemCreated),
        )
        .unwrap();
        append_event(
            &second_dir,
            &event("task-cache-b", EngineeringEventKind::ContextBuilt),
        )
        .unwrap();

        let first = load_engineering_projection(&first_dir).unwrap();
        let second = load_engineering_projection(&second_dir).unwrap();
        let first_again = load_engineering_projection(&first_dir).unwrap();

        assert!(!Arc::ptr_eq(&first, &second));
        assert!(Arc::ptr_eq(&first, &first_again));
        assert_ne!(first.events[0].kind, second.events[0].kind);
    }
}
'''
          cache_path.write_text(production + tests)

          helper = Path(".github/workflows/tmp-pr157-cache-revision.yml")
          helper.unlink()

      - name: Format and validate exact migration
        run: |
          cargo fmt --all
          git add \
            crates/repodesk-core/src/persistence/event_journal.rs \
            crates/repodesk-core/src/persistence/event_journal/revision.rs \
            crates/repodesk-core/src/engineering/events.rs \
            crates/repodesk-core/src/engineering/mod.rs \
            apps/desktop/src-tauri/Cargo.toml \
            apps/desktop/src-tauri/src/commands/engineering_projection_cache.rs \
            .github/workflows/tmp-pr157-cache-revision.yml
          git diff --cached --check
          git diff --cached --stat

      - name: Commit migration and remove helper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: key engineering projection cache by canonical revision"
          git push origin HEAD:fix/canonical-engineering-event-ledger
