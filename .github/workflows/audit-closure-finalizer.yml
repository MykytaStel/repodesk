name: Audit Closure Finalizer

on:
  push:
    branches: [fix/audit-closure-final]

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml

      - name: Finalize semantic migration and editor chunking
        shell: python
        run: |
          from pathlib import Path

          # Migration v6: per-file semantic index fingerprints.
          path = Path('crates/repodesk-core/src/persistence/migrations.rs')
          text = path.read_text()
          assert 'pub const TARGET_VERSION: i64 = 5;' in text
          text = text.replace('pub const TARGET_VERSION: i64 = 5;', 'pub const TARGET_VERSION: i64 = 6;', 1)
          old = '''    if current < 5 {\n        migrate_to_v5(conn)?;\n        set_version(conn, 5)?;\n    }\n\n    Ok(())\n}\n'''
          new = '''    if current < 5 {\n        migrate_to_v5(conn)?;\n        set_version(conn, 5)?;\n    }\n\n    if current < 6 {\n        migrate_to_v6(conn)?;\n        set_version(conn, 6)?;\n    }\n\n    Ok(())\n}\n'''
          assert old in text
          text = text.replace(old, new, 1)
          marker = 'fn column_exists(conn: &Connection, table: &str, column: &str) -> RepoDeskResult<bool> {'
          migration = '''/// Migration 6 — per-file semantic-index fingerprints.\n///\n/// Embeddings are derived local cache, but older databases already contain\n/// chunks without file-level freshness metadata. Seed those paths with an empty\n/// fingerprint so the next explicit index refresh deterministically re-embeds\n/// them rather than treating stale vectors as current.\nfn migrate_to_v6(conn: &Connection) -> RepoDeskResult<()> {\n    conn.execute(\n        "CREATE TABLE IF NOT EXISTS project_embedding_files (\n            project TEXT NOT NULL,\n            file_path TEXT NOT NULL,\n            content_fingerprint TEXT NOT NULL,\n            indexed_at TEXT NOT NULL,\n            PRIMARY KEY (project, file_path)\n        )",\n        [],\n    )\n    .map_err(|e| db_err("Failed to create project_embedding_files table", e))?;\n\n    conn.execute(\n        "INSERT OR IGNORE INTO project_embedding_files\n            (project, file_path, content_fingerprint, indexed_at)\n         SELECT DISTINCT project, file_path, '', '' FROM project_embeddings",\n        [],\n    )\n    .map_err(|e| db_err("Failed to seed embedding file metadata", e))?;\n\n    Ok(())\n}\n\n'''
          assert marker in text
          text = text.replace(marker, migration + marker, 1)
          old_test = '''        assert_eq!(meta_count, 0);\n    }\n}\n'''
          new_test = '''        assert_eq!(meta_count, 0);\n\n        // v6: per-file semantic index metadata exists.\n        let embedding_file_count: i64 = conn\n            .query_row("SELECT COUNT(*) FROM project_embedding_files", [], |row| row.get(0))\n            .unwrap();\n        assert_eq!(embedding_file_count, 0);\n    }\n}\n'''
          assert old_test in text
          path.write_text(text.replace(old_test, new_test, 1))

          # Keep the deterministic set helper scoped to tests so normal builds
          # do not carry an unused import.
          vector = Path('crates/repodesk-core/src/persistence/vector_db.rs')
          text = vector.read_text()
          text = text.replace('use std::collections::BTreeSet;\n\n', '', 1)
          text = text.replace(
              '        let set = BTreeSet::from(["z.rs", "a.rs"]);',
              '        let set = std::collections::BTreeSet::from(["z.rs", "a.rs"]);',
              1,
          )
          vector.write_text(text)

          # Heavy CodeMirror parsers are loaded only for the opened language.
          langs = Path('apps/desktop/src/features/code/editorLanguages.ts')
          text = langs.read_text()
          text = text.replace('import { javascript } from "@codemirror/lang-javascript";\n', '')
          text = text.replace('import { json } from "@codemirror/lang-json";\n', '')
          text = text.replace('import { rust } from "@codemirror/lang-rust";\n', '')
          old = '''export function editorLanguageExtension(language: string, path: string): Extension {\n  const extension = path.split(".").pop()?.toLowerCase() ?? "";\n  if (language === "rust") return rust();\n  if (language === "typescript") return javascript({ typescript: true, jsx: extension === "tsx" });\n  if (language === "javascript") return javascript({ jsx: extension === "jsx" });\n  if (language === "json") return json();\n  if (language === "html") return htmlLanguage;\n  if (language === "toml") return tomlLanguage;\n  if (language === "yaml") return yamlLanguage;\n  return [];\n}\n'''
          new = '''export function editorLanguageExtension(language: string, _path: string): Extension {\n  if (language === "html") return htmlLanguage;\n  if (language === "toml") return tomlLanguage;\n  if (language === "yaml") return yamlLanguage;\n  return [];\n}\n\nexport async function loadEditorLanguageExtension(language: string, path: string): Promise<Extension> {\n  const extension = path.split(".").pop()?.toLowerCase() ?? "";\n  if (language === "rust") {\n    const { rust } = await import("@codemirror/lang-rust");\n    return rust();\n  }\n  if (language === "typescript") {\n    const { javascript } = await import("@codemirror/lang-javascript");\n    return javascript({ typescript: true, jsx: extension === "tsx" });\n  }\n  if (language === "javascript") {\n    const { javascript } = await import("@codemirror/lang-javascript");\n    return javascript({ jsx: extension === "jsx" });\n  }\n  if (language === "json") {\n    const { json } = await import("@codemirror/lang-json");\n    return json();\n  }\n  return editorLanguageExtension(language, path);\n}\n'''
          assert old in text, 'editor language factory changed'
          langs.write_text(text.replace(old, new, 1))

          editor = Path('apps/desktop/src/features/code/SemanticCodeEditor.tsx')
          text = editor.read_text()
          text = text.replace(
              'import { editorLanguageExtension } from "./editorLanguages";',
              'import { editorLanguageExtension, loadEditorLanguageExtension } from "./editorLanguages";',
              1,
          )
          text = text.replace(
              '  const themeCompartmentRef = useRef<Compartment | null>(null);',
              '  const themeCompartmentRef = useRef<Compartment | null>(null);\n  const languageCompartmentRef = useRef<Compartment | null>(null);',
              1,
          )
          old = '''  if (!gitCompartmentRef.current) gitCompartmentRef.current = new Compartment();\n  if (!themeCompartmentRef.current) themeCompartmentRef.current = new Compartment();\n  const gitCompartment = gitCompartmentRef.current;\n  const themeCompartment = themeCompartmentRef.current;\n'''
          new = '''  if (!gitCompartmentRef.current) gitCompartmentRef.current = new Compartment();\n  if (!themeCompartmentRef.current) themeCompartmentRef.current = new Compartment();\n  if (!languageCompartmentRef.current) languageCompartmentRef.current = new Compartment();\n  const gitCompartment = gitCompartmentRef.current;\n  const themeCompartment = themeCompartmentRef.current;\n  const languageCompartment = languageCompartmentRef.current;\n'''
          assert old in text
          text = text.replace(old, new, 1)
          text = text.replace(
              '        editorLanguageExtension(language, path),',
              '        languageCompartment.of(editorLanguageExtension(language, path)),',
              1,
          )
          old = '''    const view = new EditorView({ state, parent: host });\n    viewRef.current = view;\n    view.dispatch(setDiagnostics(view.state, codeMirrorDiagnostics(view.state, semantic)));\n'''
          new = '''    const view = new EditorView({ state, parent: host });\n    viewRef.current = view;\n    let languageLoadCancelled = false;\n    void loadEditorLanguageExtension(language, path)\n      .then((extension) => {\n        if (languageLoadCancelled || viewRef.current !== view) return;\n        view.dispatch({ effects: languageCompartment.reconfigure(extension) });\n      })\n      .catch(() => {\n        // Syntax support is optional presentation state; a failed lazy chunk must\n        // not make the editor unusable or affect repository data.\n      });\n    view.dispatch(setDiagnostics(view.state, codeMirrorDiagnostics(view.state, semantic)));\n'''
          assert old in text
          text = text.replace(old, new, 1)
          text = text.replace(
              '    return () => {\n      window.removeEventListener(CODE_OPEN_EVENT, applyPendingLocation);',
              '    return () => {\n      languageLoadCancelled = true;\n      window.removeEventListener(CODE_OPEN_EVENT, applyPendingLocation);',
              1,
          )
          text = text.replace(
              '  }, [gitCompartment, language, path, readOnly, themeCompartment]);',
              '  }, [gitCompartment, language, languageCompartment, path, readOnly, themeCompartment]);',
              1,
          )
          editor.write_text(text)

      - name: Format Rust
        run: cargo fmt --all
      - name: Verify Rust audit closure
        run: |
          cargo test -p repodesk-core persistence::migrations
          cargo test -p repodesk-core smart_context
          cargo clippy -p repodesk-core --all-targets -- -D warnings
      - name: Install desktop dependencies
        working-directory: apps/desktop
        run: pnpm install --frozen-lockfile
      - name: Verify desktop build and chunking
        working-directory: apps/desktop
        run: pnpm build
      - name: Commit product finalizer
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add crates/repodesk-core/src/persistence/migrations.rs \
                  crates/repodesk-core/src/persistence/vector_db.rs \
                  crates/repodesk-core/src/smart_context.rs \
                  apps/desktop/src/features/code/editorLanguages.ts \
                  apps/desktop/src/features/code/SemanticCodeEditor.tsx
          git diff --cached --check
          git commit -m "refactor(audit): close semantic and editor bundle debt"
          git push
