name: Quick Open Cleanup

on:
  push:
    branches:
      - feat/code-quick-open-index-v2
    paths:
      - .github/workflows/quick-open-cleanup.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/code-quick-open-index-v2
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply exact cleanup patches
        shell: python
        run: |
          from pathlib import Path

          api = Path("apps/desktop/src/shared/api/codeWorkspace.ts")
          text = api.read_text()
          marker = "export function requestCodeWorkspaceOpen(\n"
          comment = '''/**\n * Lightweight hand-off between separately mounted workspace routes. Only the\n * repository-relative path and optional cursor location are persisted for the\n * one-shot transition. Rust still fully revalidates the path before reading it.\n */\n'''
          if marker not in text:
              raise SystemExit("requestCodeWorkspaceOpen marker not found")
          if comment not in text:
              text = text.replace(marker, comment + marker, 1)
          api.write_text(text)

          palette = Path("apps/desktop/src/shared/ui/CommandPalette.tsx")
          text = palette.read_text()
          old = '''    const serial = ++searchSerialRef.current;\n    const timer = window.setTimeout(() => {'''
          new = '''    const serial = ++searchSerialRef.current;\n    setRemoteCommands([]);\n    const timer = window.setTimeout(() => {'''
          if old not in text:
              raise SystemExit("CommandPalette debounce fragment not found")
          palette.write_text(text.replace(old, new, 1))

          core = Path("crates/repodesk-core/src/code_workspace_search.rs")
          text = core.read_text()
          old = '''        compare_rank(*left_rank, *right_rank)\n            .then_with(|| normalize(&left_file.path).cmp(&normalize(&right_file.path)))\n            .then_with(|| left_file.path.cmp(&right_file.path))'''
          new = '''        compare_rank(*left_rank, *right_rank)\n            .then_with(|| left_file.path.cmp(&right_file.path))'''
          if old not in text:
              raise SystemExit("Quick Open comparator fragment not found")
          core.write_text(text.replace(old, new, 1))

          Path(".github/workflows/quick-open-cleanup.yml").unlink()

      - name: Canonical Rust formatting
        run: cargo fmt --all

      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(code): finalize quick open contracts"
          git push origin HEAD:feat/code-quick-open-index-v2
