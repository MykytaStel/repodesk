name: Dev remove raw runner entrypoint

on:
  push:
    branches:
      - fix/execution-evidence-truth
    paths:
      - scripts/dev-remove-raw-run-entrypoint.py
      - .github/workflows/dev-remove-raw-run-entrypoint.yml

permissions:
  contents: write

jobs:
  green:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/execution-evidence-truth
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          components: rustfmt
      - name: Remove bypass entrypoint
        run: python3 scripts/dev-remove-raw-run-entrypoint.py
      - name: Format
        run: cargo fmt --all
      - name: Verify boundary and orchestrator
        run: |
          node --test scripts/check-source-architecture.test.mjs
          cargo test -p repodesk-core --lib orchestrator::
          cargo test -p repodesk-core --test execution_evidence_truth
      - name: Remove development helpers
        run: |
          rm scripts/dev-remove-raw-run-entrypoint.py
          rm .github/workflows/dev-remove-raw-run-entrypoint.yml
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: remove raw execution bypass entrypoint"
          git push origin HEAD:fix/execution-evidence-truth
