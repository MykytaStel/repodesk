name: Verify Safe Quit PR 178

on:
  push:
    branches:
      - fix/safe-quit-draft-flush

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-22.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: stable
          components: rustfmt
      - name: Strengthen draft project identity expectations
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('apps/desktop/e2e/code-draft-recovery.spec.ts')
          text = path.read_text()

          load_old = '''    expect(beforeSave).toContainEqual({
                cmd: "code_workspace_draft_load",
                args: {
                  input: {
                    path,
                    current_fingerprint: diskFingerprint,
                  },
                },
              });'''
          load_new = '''    expect(beforeSave).toContainEqual({
                cmd: "code_workspace_draft_load",
                args: {
                  input: {
                    path,
                    current_fingerprint: diskFingerprint,
                  },
                  projectName: "RepoDesk",
                },
              });'''
          if text.count(load_old) != 1:
              raise RuntimeError('safe draft load expectation changed unexpectedly')
          text = text.replace(load_old, load_new, 1)

          conflict_old = '''    expect(invocations).toContainEqual({
                cmd: "code_workspace_draft_load",
                args: {
                  input: {
                    path,
                    current_fingerprint: diskFingerprint,
                  },
                },
              });'''
          conflict_new = '''    expect(invocations).toContainEqual({
                cmd: "code_workspace_draft_load",
                args: {
                  input: {
                    path,
                    current_fingerprint: diskFingerprint,
                  },
                  projectName: "RepoDesk",
                },
              });'''
          if text.count(conflict_old) != 1:
              raise RuntimeError('conflict draft load expectation changed unexpectedly')
          text = text.replace(conflict_old, conflict_new, 1)

          save_old = '''    expect(beforeSave).toContainEqual({
                cmd: "code_workspace_draft_save",
                args: {
                  input: {
                    path,
                    content: recoveredContent,
                    base_fingerprint: diskFingerprint,
                  },
                },
              });'''
          save_new = '''    expect(beforeSave).toContainEqual({
                cmd: "code_workspace_draft_save",
                args: {
                  input: {
                    path,
                    content: recoveredContent,
                    base_fingerprint: diskFingerprint,
                  },
                  projectName: "RepoDesk",
                },
              });'''
          if text.count(save_old) != 1:
              raise RuntimeError('draft save expectation changed unexpectedly')
          text = text.replace(save_old, save_new, 1)

          delete_old = '      args: { relativePath: path },'
          if text.count(delete_old) != 3:
              raise RuntimeError(f'expected 3 draft delete expectations, found {text.count(delete_old)}')
          text = text.replace(delete_old, '      args: { relativePath: path, projectName: "RepoDesk" },')
          path.write_text(text)
          PY
      - name: Apply rustfmt
        run: cargo fmt --all
      - name: Commit cleanup and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/verify-safe-quit-pr178.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "test: bind draft recovery to project identity"
          git push origin "HEAD:${{ github.ref_name }}"
