name: Dev evidence contract patch

on:
  push:
    branches:
      - fix/execution-evidence-truth
    paths:
      - scripts/dev-apply-evidence-contract.py
      - .github/workflows/dev-evidence-contract-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/execution-evidence-truth
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          components: rustfmt
      - name: Apply strict patch
        run: python3 scripts/dev-apply-evidence-contract.py
      - name: Format
        run: cargo fmt --all
      - name: Verify focused contract
        run: cargo test -p repodesk-core --test execution_evidence_truth
      - name: Remove development patch helper
        run: |
          rm scripts/dev-apply-evidence-contract.py
          rm .github/workflows/dev-evidence-contract-patch.yml
      - name: Commit generated production change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: enforce changeset evidence contract"
          git push origin HEAD:fix/execution-evidence-truth
