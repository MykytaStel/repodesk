name: Dev apply executor evidence

on:
  push:
    branches:
      - fix/execution-evidence-truth
    paths:
      - scripts/dev-apply-executor-evidence.py
      - .github/workflows/dev-apply-executor-evidence.yml

permissions:
  contents: write

jobs:
  green:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/execution-evidence-truth
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          components: rustfmt
      - name: Apply strict production patch
        run: python3 scripts/dev-apply-executor-evidence.py
      - name: Format
        run: cargo fmt --all
      - name: Verify executor GREEN
        run: cargo test -p repodesk-core --lib executors::
      - name: Remove development helpers
        run: |
          rm scripts/dev-apply-executor-evidence.py
          rm .github/workflows/dev-apply-executor-evidence.yml
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: propagate executor changeset provenance"
          git push origin HEAD:fix/execution-evidence-truth
