name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref within this workflow. The namespace is
# explicit so runs created before the check process-tree fix cannot block the
# corrected workflow if an old child process ignored cancellation.
concurrency:
  group: repodesk-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Never touch a real ~/.repodesk during CI.
  REPODESK_HOME: /tmp/repodesk-dev

jobs:
  verify:
    name: Gates (fmt, clippy, tests, frontend, secret-scan)
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Tauri v2 Linux build dependencies (the desktop crate links WebKitGTK).
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable @ 2026-08-14
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      # Keep CI on the exact package-manager line declared by apps/desktop.
      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.33.2

      - name: Install Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml

      - name: Install frontend deps
        run: pnpm --dir apps/desktop install --frozen-lockfile

      # The frontend dist must exist before the Rust build: the desktop crate's
      # `tauri::generate_context!` embeds it at compile time, and dist/ is gitignored.
      - name: Build frontend
        run: pnpm --dir apps/desktop run build

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Tests
        run: cargo test --workspace

      - name: Secret scan
        run: ./scripts/secret-scan-basic.sh

  e2e-playwright:
    name: E2E smoke (Playwright, mock IPC)
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.33.2

      - name: Install Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml

      - name: Install frontend deps
        run: pnpm --dir apps/desktop install --frozen-lockfile

      - name: Install Playwright browser
        run: pnpm --dir apps/desktop exec playwright install --with-deps chromium

      # Frontend-only smoke: real React UI + mocked Tauri IPC, headless Chromium.
      # No Rust backend (cf. e2e-native.yml for the real-backend smoke).
      - name: Run daily-loop smoke
        run: pnpm --dir apps/desktop e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report
          path: apps/desktop/playwright-report/
          retention-days: 7

  supply-chain:
    name: Supply chain (cargo-deny)
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # Gates on RustSec vulnerabilities, the license allowlist, and unknown sources
      # (config + rationale in deny.toml). Unmaintained advisories are scoped to our
      # own crates so the unavoidable Tauri/GTK3 ones don't block builds.
      - name: cargo-deny
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check

  secret-scan-gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    # On pull_request events gitleaks-action lists the PR's commits via the API,
    # which needs pull-requests: read (the default token lacks it -> 403).
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      # Entropy + provider-pattern secret detection, complementing the lightweight
      # value-focused scripts/secret-scan-basic.sh. Config: .gitleaks.toml.
      - name: gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  coverage:
    name: Coverage (report only)
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable @ 2026-08-14
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@3ee274a48739f9c49921feda61cb199dc7520e62 # cargo-llvm-cov
      # Non-gating: measures coverage of the deterministic core so we can track it
      # over time and set a floor later. Uses a throwaway REPODESK_HOME.
      - name: Coverage summary
        run: cargo llvm-cov --workspace --summary-only
