name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref within this workflow. The namespace is
# explicit so runs created before the check process-tree fix cannot block the
# corrected workflow if an old child process ignored cancellation.
concurrency:
  group: repodesk-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Never touch a real ~/.repodesk during CI.
  REPODESK_HOME: /tmp/repodesk-dev

jobs:
  verify:
    name: Gates (fmt, clippy, tests, frontend, secret-scan)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      # Tauri v2 Linux build dependencies (the desktop crate links WebKitGTK).
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml

      - name: Install frontend deps
        run: pnpm --dir apps/desktop install --frozen-lockfile

      # The frontend dist must exist before the Rust build: the desktop crate's
      # `tauri::generate_context!` embeds it at compile time, and dist/ is gitignored.
      - name: Build frontend
        run: pnpm --dir apps/desktop run build

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Tests
        run: cargo test --workspace

      - name: Secret scan
        run: ./scripts/secret-scan-basic.sh

  e2e-playwright:
    name: E2E smoke (Playwright, mock IPC)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml

      - name: Install frontend deps
        run: pnpm --dir apps/desktop install --frozen-lockfile

      - name: Install Playwright browser
        run: pnpm --dir apps/desktop exec playwright install --with-deps chromium

      # Frontend-only smoke: real React UI + mocked Tauri IPC, headless Chromium.
      # No Rust backend (cf. e2e-native.yml for the real-backend smoke).
      - name: Run daily-loop smoke
        run: pnpm --dir apps/desktop e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: apps/desktop/playwright-report/
          retention-days: 7

  supply-chain:
    name: Supply chain (cargo-deny)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      # Gates on RustSec vulnerabilities, the license allowlist, and unknown sources
      # (config + rationale in deny.toml). Unmaintained advisories are scoped to our
      # own crates so the unavoidable Tauri/GTK3 ones don't block builds.
      - name: cargo-deny
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  secret-scan-gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-22.04
    # On pull_request events gitleaks-action lists the PR's commits via the API,
    # which needs pull-requests: read (the default token lacks it -> 403).
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Entropy + provider-pattern secret detection, complementing the lightweight
      # value-focused scripts/secret-scan-basic.sh. Config: .gitleaks.toml.
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  coverage:
    name: Coverage (report only)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-llvm-cov
      # Non-gating: measures coverage of the deterministic core so we can track it
      # over time and set a floor later. Uses a throwaway REPODESK_HOME.
      - name: Coverage summary
        run: cargo llvm-cov --workspace --summary-only
