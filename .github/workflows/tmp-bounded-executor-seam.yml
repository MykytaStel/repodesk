name: Temporary bounded executor seam

on:
  push:
    branches:
      - perf/bounded-executor-output

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: perf/bounded-executor-output
          fetch-depth: 1
      - name: Move bounded reader behind process module seam
        shell: python
        run: |
          from pathlib import Path
          path = Path("crates/repodesk-core/src/executors.rs")
          text = path.read_text()
          old_import = "use crate::git_workspace::{self, GitFileChange};\n"
          new_import = "use crate::git_workspace::{self, GitFileChange};\n\nmod process;\nuse process::read_bounded;\n"
          if text.count(old_import) != 1:
              raise SystemExit("unexpected executor import seam")
          text = text.replace(old_import, new_import, 1)
          old_fn = "/// Read at most `max` bytes of a file, lossily decoded. Returns the text and\n/// whether it was truncated (a marker is appended when so).\nfn read_bounded(path: &Path, max: usize) -> RepoDeskResult<(String, bool)> {\n    let bytes = fs::read(path)?;\n    let truncated = bytes.len() > max;\n    let slice = if truncated { &bytes[..max] } else { &bytes[..] };\n    let mut text = String::from_utf8_lossy(slice).into_owned();\n    if truncated {\n        text.push_str(\"\\n[output truncated]\");\n    }\n    Ok((text, truncated))\n}\n\n"
          if text.count(old_fn) != 1:
              raise SystemExit("unexpected read_bounded implementation")
          path.write_text(text.replace(old_fn, "", 1))
          Path(".github/workflows/tmp-bounded-executor-seam.yml").unlink()
      - name: Format and commit
        run: |
          cargo fmt --all
          git add -A
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "refactor: isolate bounded executor output reading"
          git push origin HEAD:perf/bounded-executor-output
