name: Dev stage executor evidence tests

on:
  push:
    branches:
      - fix/execution-evidence-truth
    paths:
      - scripts/dev-stage-executor-evidence-tests.py
      - .github/workflows/dev-stage-executor-evidence-tests.yml

permissions:
  contents: write

jobs:
  red:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/execution-evidence-truth
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          components: rustfmt
      - name: Stage test-only patch
        run: python3 scripts/dev-stage-executor-evidence-tests.py
      - name: Format test patch
        run: cargo fmt --all
      - name: Confirm RED
        shell: bash
        run: |
          set +e
          cargo test -p repodesk-core executors::tests::run_command_captures_git_changeset executors::runtime::tests::execution_issues_are_secret_redacted_and_bounded 2>&1 | tee /tmp/red.log
          code=${PIPESTATUS[0]}
          set -e
          if [ "$code" -eq 0 ]; then
            echo "Expected executor evidence tests to fail before production implementation"
            exit 1
          fi
          grep -Eq "change_evidence_status|MAX_EXECUTION_ISSUES|MAX_EXECUTION_ISSUE_BYTES" /tmp/red.log
      - name: Remove development helpers
        run: |
          rm scripts/dev-stage-executor-evidence-tests.py
          rm .github/workflows/dev-stage-executor-evidence-tests.yml
      - name: Commit RED tests
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "test: define executor evidence provenance contract"
          git push origin HEAD:fix/execution-evidence-truth
