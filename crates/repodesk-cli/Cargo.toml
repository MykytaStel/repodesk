[package]
name = "repodesk-cli"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
name = "repodesk_cli"
path = "src/lib.rs"

[[bin]]
name = "repodesk"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap = { version = "4", features = ["derive"] }
repodesk-core = { path = "../repodesk-core" }
tokio.workspace = true
