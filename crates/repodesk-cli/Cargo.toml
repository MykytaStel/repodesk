[package]
name = "repodesk-cli"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "repodesk"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
repodesk-core = { path = "../repodesk-core" }
tokio = { version = "1.52.3", features = ["rt-multi-thread", "macros", "fs"] }
