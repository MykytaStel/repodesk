[package]
name = "repodesk-core"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
dirs = "6.0.0"
serde = { version = "1", features = ["derive"] }
thiserror = "2.0.18"
toml = "0.8.2"
serde_json = "1.0.150"
tokio = { version = "1.52.3", features = ["fs", "rt", "macros", "time"] }
async-recursion = "1.1.1"
shlex = "2.0.1"
regex = "1.12.3"
rusqlite = { version = "0.32.1", features = ["bundled"] }
indexmap = "2.2.6"
wait-timeout = "0.2.0"
reqwest = { version = "0.12", features = ["json"] }


