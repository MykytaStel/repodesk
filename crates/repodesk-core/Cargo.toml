[package]
name = "repodesk-core"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
dirs = "5"
serde = { version = "1", features = ["derive"] }
thiserror = "1"
toml = "0.8"
serde_json = "1"
tokio = { version = "1.52.3", features = ["fs", "rt", "macros", "time"] }
async-recursion = "1.1.1"
shlex = "2.0.1"
regex = "1.12.3"
