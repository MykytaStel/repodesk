[package]
name = "repodesk-core"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
anyhow.workspace = true
chrono.workspace = true
dirs.workspace = true
serde.workspace = true
thiserror.workspace = true
toml = "1.1.4"
serde_json.workspace = true
tokio.workspace = true
async-recursion = "1.1.1"
shlex = "2.0.1"
regex = "1.12.3"
rusqlite.workspace = true
indexmap = "2.2.6"
wait-timeout = "0.2.0"
# Async HTTP client used by provider APIs.
reqwest = { version = "0.13", features = ["json"] }
sha2.workspace = true
hex = "0.4"
keyring = "4"
# Blocking client retained for synchronous local-runtime adapters (for example embeddings).
ureq.workspace = true
syn = { version = "3", features = ["full", "visit"] }
tempfile.workspace = true

[dev-dependencies]
serial_test = "4"
