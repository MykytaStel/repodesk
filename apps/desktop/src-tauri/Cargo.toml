[package]
name = "repodesk-desktop"
version = "0.1.0"
description = "RepoDesk local-first desktop cockpit"
edition = "2024"
publish = false

[lib]
name = "repodesk_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
rusqlite = { version = "0.32.1", features = ["bundled"] }
dirs = "6"
repodesk-core = { path = "../../../crates/repodesk-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-updater = "2"
thiserror = "2.0.18"
ureq = { version = "3.3.0", features = ["json"] }


